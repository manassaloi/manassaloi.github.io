# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Manas J. Saloi
# email: your-email@example.com
description: Hi, I am Manas J Saloi. As an engineer turned product manager and now head of product, I've built products used by millions of people across South East Asia. I am based out of Bengaluru.
baseurl: "" # the subpath of your site, e.g. /blog
# Set explicitly: the GitHub Actions build does not fill it in the way the old Pages build did,
# and the RSS feed, sitemap and social previews need full links. `jekyll serve` uses localhost instead.
url: "https://manassaloi.com"
twitter_username: manasjsaloi
github_username:  manassaloi

defaults:
  - scope:
      path: ""
    values:
      image: https://manassaloi.com/manas.webp

twitter:
  username: manas_saloi
  card: summary_large_image

# Footer nav, on every page. `sketch` is the home-page drawing in assets/img/home/ shown on hover.
# A replaced drawing gets a new file name: browsers keep images for 10 minutes and would show the old one.
nav:
  - { label: "Posts", url: "/posts/", sketch: "posts" }
  - { label: "Book Notes", url: "/booksummaries/", sketch: "book-notes" }
  - { label: "Bookshelf", url: "/bookshelf/", sketch: "bookshelf" }
  - { label: "Proof of Work", url: "/proofofwork/", sketch: "proof-of-work" }
  - { label: "Uses This", url: "/usesthis/", sketch: "uses-this" }
  - { label: "Links", url: "/links/", sketch: "links" }

# Build settings
# Built by GitHub Actions (.github/workflows/pages.yml), so _plugins/ runs in production too.
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

liquid:
  error_mode: strict
  strict_filters: true
